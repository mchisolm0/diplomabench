<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diplomabench watch</title>
<style>
:root {
  --ink: #10151d; --land: #1c232d; --rule: #232b36; --raise: #171d26;
  --text: #e3e7ec; --dim: #8d97a5; --faint: #5c6673;
  --ALPHA: #f07167; --BETA: #5aa9e6; --GAMMA: #6cc49a; --DELTA: #f2c14e; --EPSILON: #b48ce8;
  /* Owned ground: each power's color, darkened by hand so yellow stays amber, not olive. */
  --ALPHA-land: #4a2b2f; --BETA-land: #1e3850; --GAMMA-land: #1e4234; --DELTA-land: #4f3c18; --EPSILON-land: #3a2c52;
  --serif: Charter, "Bitstream Charter", "Iowan Old Style", Georgia, ui-serif, serif;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "JetBrains Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ink); color: var(--text); font: 13px/1.45 var(--sans); font-variant-numeric: tabular-nums; }
button, a.btn { font: inherit; color: var(--text); background: none; border: 0; padding: 4px 8px; border-radius: 3px; cursor: pointer; text-decoration: none; }
button:hover, a.btn:hover { background: var(--raise); }
button:focus-visible, a.btn:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
button:disabled { color: var(--faint); background: none; cursor: default; }
button.on { background: var(--raise); box-shadow: inset 0 0 0 1px var(--rule); }
[hidden] { display: none !important; }

/* Top: where we are, the controls, and the game at a glance */
header { position: sticky; top: 0; z-index: 2; background: var(--ink); padding: 12px 20px 0; }
.row { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
h1 { font: 400 26px/1.1 var(--serif); margin: 0; letter-spacing: -0.01em; }
.state { color: var(--dim); }
.transport { margin-left: auto; display: flex; gap: 2px; align-items: center; white-space: nowrap; flex-wrap: wrap; }
.transport .g { font-size: 17px; line-height: 1; padding: 3px 8px; }
.transport .sep { width: 1px; height: 16px; background: var(--rule); margin: 0 6px; }
.play { min-width: 64px; font-weight: 600; }
.band { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; margin-top: 12px; }
.band button { padding: 0; height: 26px; display: flex; flex-direction: column-reverse; border-radius: 0; overflow: hidden; opacity: .45; }
.band button.done { opacity: .8; }
.band button.on { opacity: 1; box-shadow: none; outline: 1px solid var(--text); outline-offset: 1px; }
.band i { display: block; width: 100%; }
.years { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); color: var(--faint); font-size: 11px; padding: 3px 0 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }

main { display: grid; grid-template-columns: minmax(340px, 600px) minmax(0, 1fr); }
.left { padding: 16px 20px; border-right: 1px solid var(--rule); }
.right { padding: 16px 24px; min-width: 0; }
svg { display: block; width: 100%; height: auto; }
.outcome { margin: 10px 0 18px; color: var(--dim); min-height: 1.4em; }
.outcome b { font-weight: 600; }

/* Standings */
.ledger { width: 100%; border-collapse: collapse; }
.ledger td { padding: 7px 0; border-top: 1px solid var(--rule); vertical-align: middle; }
.ledger tr { cursor: pointer; }
.ledger tr:hover td { background: var(--raise); }
.ledger .name { font-weight: 600; padding-left: 10px; box-shadow: inset 3px 0 0 var(--c); }
.ledger .model { color: var(--dim); overflow-wrap: anywhere; }
.ledger .n { text-align: right; font: 400 20px/1 var(--serif); width: 36px; }
.ledger .spark { width: 84px; padding-left: 12px; }
.ledger tr.out td { color: var(--faint); }
.ledger tr.out .n { font-size: 12px; font-family: var(--sans); white-space: nowrap; width: auto; }
.ledger tr.sel .name { box-shadow: inset 6px 0 0 var(--c); }

/* Press */
.pane-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
.pane-head h2 { font: 400 18px/1.2 var(--serif); margin: 0; }
.pane-head .hint { color: var(--faint); }
.pane-head button { margin-left: auto; }
.msg { padding: 12px 0 12px 14px; border-top: 1px solid var(--rule); box-shadow: inset 2px 0 0 transparent; max-width: 76ch; }
.msg.now { box-shadow: inset 2px 0 0 var(--c); }
.msg .who { font-weight: 600; color: var(--c); }
.msg .to { color: var(--dim); }
.msg p { margin: 4px 0 0; font: 15px/1.55 var(--serif); color: #d3d8df; white-space: pre-wrap; overflow-wrap: anywhere; }
.more { color: var(--faint); padding: 12px 0 0 14px; border-top: 1px solid var(--rule); max-width: 76ch; }

/* Inspector */
.trace { max-width: 84ch; }
.trace > div { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; padding: 6px 0; border-top: 1px solid var(--rule); overflow-wrap: anywhere; }
.trace .t { color: var(--faint); font-size: 11px; padding-top: 2px; text-align: right; }
.trace .thinking { color: var(--dim); font-style: italic; }
.trace .said p { margin: 2px 0 0; font: 14px/1.5 var(--serif); white-space: pre-wrap; }
.trace .call { font-family: var(--mono); font-size: 12px; color: #a9bdd1; }
.trace .call span { color: var(--faint); }
.trace details summary { cursor: pointer; list-style: none; }
.trace details pre { margin: 6px 0 0; white-space: pre-wrap; font: 12px/1.45 var(--mono); color: var(--dim); }
.trace .quiet { color: var(--faint); }
.trace .error { color: var(--ALPHA); }

/* Review */
.grid { border-collapse: collapse; margin: 4px 0 20px; }
.grid th { font-weight: 400; color: var(--faint); text-align: right; padding: 0 0 6px 14px; white-space: nowrap; }
.grid td { padding: 6px 0 6px 14px; border-top: 1px solid var(--rule); text-align: right; }
.grid td:first-child, .grid th:first-child { text-align: left; padding-left: 10px; }
.grid td:first-child { font-weight: 600; box-shadow: inset 3px 0 0 var(--c); }
.grid .avg { font: 400 18px/1 var(--serif); }
.grid .self { color: var(--faint); }
.judged { padding: 14px 0 6px; border-top: 1px solid var(--rule); max-width: 80ch; }
.judged h3 { margin: 0; font: 400 18px/1.3 var(--serif); color: var(--c); }
.judged h3 span { font: 13px var(--sans); color: var(--faint); margin-left: 8px; }
.judged .plan { margin: 6px 0 8px; font: 15px/1.55 var(--serif); color: #d3d8df; }
.judged .line { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; padding: 4px 0; }
.judged .k { color: var(--dim); }
.ph { padding: 0 3px; color: var(--dim); text-decoration: underline dotted; text-underline-offset: 3px; }

@media (min-width: 901px) {
  /* Each column scrolls on its own, so the map stays in view while messages run. */
  main { height: calc(100vh - var(--head, 90px)); }
  .left, .right { overflow-y: auto; }
  /* Room for the standings under the map. */
  #map { max-height: calc(100vh - var(--head, 90px) - 260px); min-height: 320px; }
}
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; }
  .left { border-right: 0; border-bottom: 1px solid var(--rule); }
  header { padding: 10px 16px 0; }
  .left, .right { padding: 14px 16px; }
  .transport { margin-left: 0; width: 100%; }
  .ledger .model { display: none; }
  .grid .rater { display: none; }
}
@media (prefers-reduced-motion: no-preference) { .tok { transition: transform .35s ease; } }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1 id="title">Waiting for the game</h1>
    <span class="state" id="state"></span>
    <div class="transport">
      <button class="g" id="pp" title="Previous phase (Shift+Left)" aria-label="Previous phase">⇤</button>
      <button class="g" id="pc" title="Previous change (Left)" aria-label="Previous change">←</button>
      <button id="play" class="play" title="Play (Space)">Play</button>
      <button class="g" id="nc" title="Next change (Right)" aria-label="Next change">→</button>
      <button class="g" id="np" title="Next phase (Shift+Right)" aria-label="Next phase">⇥</button>
      <button id="real" title="Play with the real time between changes">Real time</button>
      <button id="live" title="Follow the game as it is played" hidden>Live</button>
      <span class="sep"></span>
      <button id="testing" title="Show the selected player's thinking and tool calls">Testing</button>
      <span class="sep" id="savesep"></span>
      <a class="btn" id="save" href="replay.html" download="replay.html" title="Save this game as one HTML file">Save HTML</a>
    </div>
  </div>
  <div class="band" id="band"></div>
  <div class="years" id="years"></div>
</header>
<main>
  <section class="left">
    <svg id="map" viewBox="-128 -128 256 256" role="img" aria-label="Board"></svg>
    <div class="outcome" id="outcome"></div>
    <table class="ledger" id="ledger"></table>
  </section>
  <section class="right" id="right"></section>
</main>
<!--EVENTS-->
<script>
const POWERS = ["ALPHA", "BETA", "GAMMA", "DELTA", "EPSILON"];
const C = (p) => `var(--${p})`;
const nice = (p) => p[0] + p.slice(1).toLowerCase();
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const season = (ph) => `${ph[0] === "S" ? "Spring" : "Fall"} ${ph.slice(1)}`;
const list = (xs) => (xs.length < 2 ? xs.join("") : `${xs.slice(0, -1).join(", ")} and ${xs.at(-1)}`);
const count = (board, p) => Object.values(board).filter((o) => o === p).length;
const replay = Boolean(window.EVENTS);

// The game as events describe it: one entry per phase, with its messages,
// each player's log (game tools, harness trace, turn end) and its resolution.
const G = { map: null, seats: {}, phases: [], last: 0, review: null, stage: "", final: null, seed: [] };
// After a finished game, or once players review it, a last page shows the final board and their review.
const REVIEW = new Set(["debrief", "peers"]);
function finalPage(at) {
  const state = G.phases.at(-1)?.after;
  if (!G.final && state) G.phases.push((G.final = { phase: "review", before: state, after: state, start: at, msgs: [], log: {}, turns: {}, submitted: {}, record: null, end: at }));
  return G.final;
}
const phaseOf = (name, at) => (REVIEW.has(name) ? finalPage(at) : G.phases.find((q) => q.phase === name));
let cells = null, at = null, centers = null, homeOf = null;

function ingest(e) {
  G.last = e.at;
  const cur = G.phases.at(-1);
  const logOf = (p, power) => ((p.log[power] ??= []));
  switch (e.kind) {
    case "game":
      G.map = e.map;
      G.seats = e.seats;
      // A probe starts mid-game; its first phase opens with the messages that came before.
      G.seed = e.messages;
      layout(e.map);
      break;
    case "phase":
      G.phases.push({ phase: e.phase, before: e.state, deadline: e.deadline, start: e.at, msgs: G.phases.length ? [] : G.seed.map((m) => ({ ...m, at: e.at })), log: {}, turns: {}, submitted: {}, record: null, after: null, end: 0 });
      break;
    case "message":
      cur?.msgs.push({ ...e.message, at: e.at });
      break;
    case "tool": {
      const p = phaseOf(e.phase, e.at);
      if (!p) break;
      logOf(p, e.power).push({ at: e.at, t: "game", name: e.tool, args: e.args, result: e.result });
      // The game's reply names the orders as it will play them ("Recorded: ALP - ABY, BET H."), not as typed.
      if (e.tool === "submit_orders" && e.result.startsWith("Recorded: ")) {
        p.submitted[e.power] = e.result.split("\n")[0].slice(10, -1).split(", ");
        p.ordered = e.at;
      }
      break;
    }
    case "trace": {
      const p = phaseOf(e.phase, e.at);
      if (p) logOf(p, e.power).push({ at: e.at, t: e.item.type, name: e.item.name, text: e.item.text });
      break;
    }
    case "turn": {
      const p = phaseOf(e.phase, e.at);
      if (!p) break;
      p.turns[e.power] = e;
      logOf(p, e.power).push({ at: e.at, t: "turn", ...e });
      break;
    }
    case "resolved":
      if (!cur) break;
      cur.record = e.record;
      cur.after = e.state;
      cur.end = e.at;
      if (e.state.result) finalPage(e.at);
      break;
    case "review":
      G.review = e.review;
      G.stage = e.stage;
      finalPage(e.at);
      break;
  }
}

// Territories: each province's region is the part of the disc closer to it than to any other
// province. On v2 the regions that touch are exactly the adjacent provinces.
function layout(map) {
  at = {};
  const homes = new Set(Object.values(map.homes).flat());
  POWERS.forEach((p, i) => { const t = -Math.PI / 2 + (i * 2 * Math.PI) / 5; for (const h of map.homes[p]) at[h] = { x: 100 * Math.cos(t), y: 100 * Math.sin(t), t }; });
  for (const id of map.provinces) {
    if (at[id]) continue;
    const near = map.adjacent[id].filter((n) => homes.has(n));
    if (!near.length) { at[id] = { x: 0, y: 0 }; continue; }
    const t = Math.atan2(near.reduce((s, h) => s + Math.sin(at[h].t), 0), near.reduce((s, h) => s + Math.cos(at[h].t), 0));
    const r = near.length >= 2 ? 78 : 50;
    at[id] = { x: r * Math.cos(t), y: r * Math.sin(t), t };
  }
  const disc = Array.from({ length: 120 }, (_, i) => ({ x: 124 * Math.cos((i * Math.PI) / 60), y: 124 * Math.sin((i * Math.PI) / 60) }));
  const clip = (poly, a, b) => {
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, nx = b.x - a.x, ny = b.y - a.y, f = (p) => (p.x - mx) * nx + (p.y - my) * ny, out = [];
    poly.forEach((p, i) => { const q = poly[(i + 1) % poly.length], fp = f(p), fq = f(q); if (fp <= 0) out.push(p); if (fp < 0 !== fq < 0) { const t = fp / (fp - fq); out.push({ x: p.x + t * (q.x - p.x), y: p.y + t * (q.y - p.y) }); } });
    return out;
  };
  cells = Object.fromEntries(map.provinces.map((id) => [id, map.provinces.reduce((poly, o) => (o === id || (at[o].x === at[id].x && at[o].y === at[id].y) ? poly : clip(poly, at[id], at[o])), disc)]));
  centers = new Set(map.centers);
  homeOf = Object.fromEntries(Object.entries(map.homes).flatMap(([p, hs]) => hs.map((h) => [h, p])));
}

// Replay position: a phase and a change inside it (opens, each message, orders, resolution).
function steps(p) {
  if (p === G.final) return [{ k: "review", at: p.start }];
  return [{ k: "open", at: p.start }, ...p.msgs.map((m, i) => ({ k: "msg", i, at: m.at })), { k: "orders", at: p.record ? Math.max(p.ordered ?? p.end, p.msgs.at(-1)?.at ?? 0) : Infinity }, ...(p.record ? [{ k: "resolved", at: p.end }] : [])];
}
let pi = 0, si = 0, follow = !replay, seat = POWERS[0], testing = false, filter = null, playing = false, real = false, timer = 0;
const ph = () => G.phases[pi];
const st = () => steps(ph())[si];
const atEnd = () => pi === G.phases.length - 1 && si === steps(ph()).length - 1;
const timeOf = () => (follow || st().k === "review" ? Infinity : st().at);

const parseOrder = (text) => {
  const t = String(text).toUpperCase().replace(/->/g, "-").trim();
  let m = t.match(/^(\w+)\s*-\s*(\w+)$/);
  if (m) return { unit: m[1], action: "move", to: m[2] };
  m = t.match(/^(\w+)\s+S\s+(\w+)\s*-\s*(\w+)$/);
  if (m) return { unit: m[1], action: "support_move", target: m[2], to: m[3] };
  m = t.match(/^(\w+)\s+S\s+(\w+)$/);
  return m ? { unit: m[1], action: "support_hold", target: m[2] } : null;
};
// Orders as resolved, or while a phase is open, as players have submitted them so far.
const ordersOf = (p) => p.record?.orders ?? Object.fromEntries(Object.entries(p.submitted).map(([pw, os]) => [pw, os.map(parseOrder).filter((o) => o && [o.unit, o.to, o.target].every((id) => !id || at[id]))]));

function arrow(a, b, pw, { support, failed } = {}) {
  const color = C(pw);
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
  const x1 = a.x + ux * 9, y1 = a.y + uy * 9, x2 = b.x - ux * (support ? 4 : 11), y2 = b.y - uy * (support ? 4 : 11);
  // A slight bend keeps opposing moves apart.
  const cx = (x1 + x2) / 2 - uy * 6, cy = (y1 + y2) / 2 + ux * 6;
  if (support) return `<path d="M${x1} ${y1}Q${cx} ${cy} ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="1.3" stroke-dasharray="1.5 2.5" stroke-linecap="round"/>`;
  const end = failed ? `<path d="M${x2 - uy * 5} ${y2 + ux * 5}L${x2 + uy * 5} ${y2 - ux * 5}" stroke="${color}" stroke-width="2.4" stroke-linecap="round"/>` : "";
  return `<path d="M${x1} ${y1}Q${cx} ${cy} ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="${failed ? 1.6 : 2.6}" ${failed ? 'stroke-dasharray="4 3" stroke-opacity=".8"' : ""} stroke-linecap="round" ${failed ? "" : `marker-end="url(#head-${pw})"`}/>${end}`;
}

/** The board to draw: before the phase, or after it once resolved. */
const board = () => (st().k === "open" || st().k === "msg" || st().k === "orders" ? ph().before : ph().after);

function renderMap() {
  const p = ph(), k = st().k, resolved = k === "resolved", s = board(), map = G.map;
  const moved = new Set(p.record?.moved), lost = new Map((p.record?.dislodged ?? []).map((d) => [d.unit, d.power])), built = new Map((p.record?.builds ?? []).map((b) => [b.unit, b.power]));
  const o = [`<defs>${POWERS.map((pw) => `<marker id="head-${pw}" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="${C(pw)}"/></marker>`).join("")}</defs>`];
  for (const id of map.provinces) {
    const owner = s.owners[id], pts = cells[id].map((q) => `${q.x.toFixed(2)},${q.y.toFixed(2)}`).join(" ");
    o.push(`<polygon points="${pts}" fill="${owner ? `var(--${owner}-land)` : "var(--land)"}" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"><title>${esc(map.names[id])}${owner ? `, ${nice(owner)}` : ""}</title></polygon>`);
  }
  for (const id of map.provinces) {
    // Labels sit on the side away from the middle, where fewer arrows pass.
    const { x, y } = at[id], r = Math.hypot(x, y), ux = r > 1 ? x / r : 0, uy = r > 1 ? y / r : 1;
    const lx = x + ux * 16, ly = y + uy * 16 + 2.6;
    o.push(`<text x="${lx}" y="${ly}" text-anchor="middle" font-size="7.5" letter-spacing=".06em" fill="var(--dim)" font-family="var(--sans)">${id}</text>`);
    if (centers.has(id)) o.push(`<circle cx="${lx}" cy="${ly + 4.5}" r="1.6" fill="${homeOf[id] ? C(homeOf[id]) : "var(--dim)"}"/>`);
  }
  if (k === "orders" || resolved) for (const [pw, os] of Object.entries(ordersOf(p))) for (const od of os) {
    if (od.action === "move") o.push(arrow(at[od.unit], at[od.to], pw, { failed: resolved && !moved.has(od.unit) }));
    if (od.action === "support_move") o.push(arrow(at[od.unit], { x: (at[od.target].x + at[od.to].x) / 2, y: (at[od.target].y + at[od.to].y) / 2 }, pw, { support: true }));
    if (od.action === "support_hold") o.push(arrow(at[od.unit], at[od.target], pw, { support: true }));
  }
  for (const [id, pw] of Object.entries(s.units)) {
    const { x, y } = at[id];
    o.push(`<circle class="tok" cx="${x}" cy="${y}" r="6.5" fill="${C(pw)}" stroke="var(--ink)" stroke-width="1.6"><title>${nice(pw)} army in ${esc(map.names[id])}</title></circle>`);
    if (resolved && built.has(id)) o.push(`<circle cx="${x}" cy="${y}" r="9.5" fill="none" stroke="${C(pw)}" stroke-width="1"/>`);
  }
  if (resolved) for (const [id, pw] of lost) {
    const { x, y } = at[id];
    o.push(`<g transform="translate(${x + 6} ${y - 6})"><circle r="4.5" fill="var(--ink)" stroke="${C(pw)}" stroke-width="1.2"/><path d="M-2 -2L2 2M2 -2L-2 2" stroke="${C(pw)}" stroke-width="1.2"/><title>${nice(pw)} army destroyed</title></g>`);
  }
  document.getElementById("map").innerHTML = o.join("");
}

function outcome() {
  const p = ph(), k = st().k, r = p.record;
  if (k === "review") {
    const result = p.after.result;
    return result?.kind === "solo" ? `${nice(result.winners[0])} won alone.` : result ? `The game ended at the year limit.` : `The game stopped after ${G.phases.at(-2).phase}.`;
  }
  if (k === "open") return `${Object.keys(p.before.units).length} armies on the board.`;
  if (k === "msg") return `Negotiating. ${si} of ${p.msgs.length} messages sent.`;
  if (k === "orders") return r ? "Orders are in." : `Orders so far from ${list(Object.keys(p.submitted).map(nice)) || "nobody"}.`;
  const moved = new Set(r.moved), parts = [];
  const moves = Object.entries(r.orders).flatMap(([pw, os]) => os.filter((x) => x.action === "move").map((x) => ({ pw, x })));
  const won = moves.filter(({ x }) => moved.has(x.unit)).map(({ pw, x }) => `<b style="color:${C(pw)}">${x.unit} to ${x.to}</b>`);
  const bounced = moves.filter(({ x }) => !moved.has(x.unit)).map(({ pw, x }) => `<span style="color:${C(pw)}">${x.unit} to ${x.to}</span>`);
  if (won.length) parts.push(`${list(won)} succeeded.`);
  if (bounced.length) parts.push(`${list(bounced)} bounced.`);
  for (const d of r.dislodged) parts.push(`${nice(d.power)} lost the army in ${d.unit}.`);
  if (r.builds.length) parts.push(`${list(r.builds.map((b) => `${nice(b.power)} built in ${b.unit}`))}.`);
  for (const d of r.disbands) parts.push(`${nice(d.power)} disbanded ${d.unit}.`);
  const result = p.after.result;
  if (result) parts.push(result.kind === "solo" ? `${nice(result.winners[0])} wins alone.` : `The game ends at the year limit.`);
  return parts.join(" ") || "Everyone held.";
}

function renderLedger() {
  const s = board(), total = G.map.centers.length;
  const upto = G.phases.slice(0, st().k === "resolved" ? pi + 1 : pi).filter((q) => q.after && q !== G.final);
  document.getElementById("ledger").innerHTML = POWERS.map((pw) => {
    const n = count(s.owners, pw);
    // A power with no armies is out, though centers it still holds keep counting.
    const alive = Object.values(s.units).includes(pw);
    const outAt = upto.find((q) => !Object.values(q.after.units).includes(pw));
    const hist = [count(G.phases[0].before.owners, pw), ...upto.map((q) => count(q.after.owners, pw))];
    const pts = hist.map((v, i) => `${(i / Math.max(1, G.phases.length - (G.final ? 1 : 0))) * 80},${21 - (v / total) * 20}`).join(" ");
    return `<tr class="${alive ? "" : "out"} ${pw === seat && testing ? "sel" : ""}" data-seat="${pw}" style="--c:${C(pw)}">
      <td class="name">${nice(pw)}</td><td class="model">${esc(G.seats[pw])}</td>
      <td class="n">${alive ? n : `out in ${outAt ? outAt.phase.slice(1) : ""}${n ? `, ${n} ${n === 1 ? "center" : "centers"}` : ""}`}</td>
      <td class="spark"><svg viewBox="0 0 80 22" style="height:18px"><polyline points="${pts}" fill="none" stroke="${C(pw)}" stroke-width="1.4" ${alive ? "" : 'stroke-opacity=".4"'}/></svg></td></tr>`;
  }).join("");
}

function renderPress() {
  const p = ph(), k = st().k, shown = k === "msg" ? st().i + 1 : k === "open" ? 0 : p.msgs.length;
  const rows = p.msgs.slice(0, shown).map((m, i) => ({ m, i })).filter(({ m }) => !filter || m.from === filter || m.to.includes(filter));
  const left = p.msgs.length - shown;
  const everyone = (m) => m.broadcast || m.to.length === POWERS.length - 1;
  return `<div class="pane-head"><h2>Messages</h2><span class="hint">${filter ? `to and from ${nice(filter)}` : "everything sent this phase, private ones too"}</span>${filter ? `<button data-clear>Show all</button>` : ""}</div>
    ${rows.map(({ m, i }) => `<div class="msg ${k === "msg" && i === shown - 1 ? "now" : ""}" style="--c:${C(m.from)}"><span class="who">${nice(m.from)}</span> <span class="to">to ${everyone(m) ? "everyone" : list(m.to.map(nice))}${m.phase !== p.phase ? ` in ${esc(m.phase)}` : ""}</span><p>${esc(m.text)}</p></div>`).join("") || `<div class="more">No messages ${shown ? "to or from them" : "yet"}.</div>`}
    ${left ? `<div class="more">${left} more this phase.</div>` : ""}`;
}

// Calls a player makes over and over while it waits; folded into one line.
const QUIET = new Set(["wait", "status", "inbox"]);
function traceRows(log, start) {
  const rows = [];
  let quiet = {};
  const flush = () => { const q = Object.entries(quiet); if (q.length) rows.push(`<div><span class="t"></span><span class="quiet">${list(q.map(([k, c]) => `${k} ${c === 1 ? "once" : `${c} times`}`))}</span></div>`); quiet = {}; };
  for (const e of log) {
    const t = `<span class="t">${Math.max(0, Math.round((e.at - start) / 1000))}s</span>`;
    if (e.t === "game" && QUIET.has(e.name) && !e.result.startsWith("Error")) { quiet[e.name] = (quiet[e.name] ?? 0) + 1; continue; }
    flush();
    if (e.t === "thinking") rows.push(`<div>${t}<span class="thinking">${esc(e.text.replace(/\*\*/g, "").trim().replace(/\n+/g, ". "))}</span></div>`);
    else if (e.t === "text") rows.push(`<div>${t}<span>${esc(e.text)}</span></div>`);
    else if (e.t === "turn") rows.push(`<div>${t}<span class="${e.error ? "error" : "quiet"}">Turn over${e.durationMs ? ` after ${Math.round(e.durationMs / 1000)}s` : ""}${e.error ? `: ${esc(e.error)}` : "."}</span></div>`);
    else if (e.t === "game" && e.name === "send_message" && !e.result.startsWith("Error")) rows.push(`<div>${t}<span class="said">Sent to ${esc(list((e.args.to ?? []).map((x) => (x === "ALL" ? "everyone" : nice(String(x).toUpperCase())))))}<p>${esc(e.args.text)}</p></span></div>`);
    else {
      const name = e.t === "game" ? e.name : e.t === "tool_call" ? e.name ?? "tool" : "result";
      const args = e.t === "game" ? (Object.keys(e.args ?? {}).length ? JSON.stringify(e.args) : "") : e.t === "tool_call" ? e.text : "";
      const body = e.t === "game" ? e.result : e.t === "tool_call" ? "" : e.text;
      rows.push(`<div>${t}<details><summary class="call ${e.t === "game" && e.result.startsWith("Error") ? "error" : ""}">${esc(name)} <span>${esc(args)}</span></summary>${body ? `<pre>${esc(body)}</pre>` : ""}</details></div>`);
    }
  }
  flush();
  return rows.join("");
}

function renderInspector() {
  const p = ph(), turn = p.turns[seat], until = timeOf();
  const log = (p.log[seat] ?? []).filter((e) => e.at <= until);
  return `<div class="pane-head"><h2 style="color:${C(seat)}">${nice(seat)}</h2><span class="hint">${esc(G.seats[seat])}${turn?.durationMs && until >= turn.at ? `, turn took ${Math.round(turn.durationMs / 1000)}s` : ""}</span></div>
    ${log.length ? `<div class="trace">${traceRows(log, p.start)}</div>` : `<div class="more">Nothing yet this phase.</div>`}`;
}

const ordinal = (n) => `${n}${["st", "nd", "rd"][n - 1] ?? "th"}`;
const phaseLink = (ph) => (G.phases.some((q) => q.phase === ph) ? `<button class="ph" data-go="${esc(ph)}">${esc(ph)}</button>` : esc(ph));

// The game in the players' own words: each power's debrief, then what the others said about it.
function renderReview() {
  const R = G.review, s = G.final.after;
  if (!R) return `<div class="pane-head"><h2>Review</h2></div><div class="more">No review for this game. Play it with --review to hear from the players.</div>`;
  const raters = POWERS.filter((p) => R.ranks[p]);
  const rankOf = (rater, p) => R.ranks[rater]?.findIndex((r) => r.power === p) + 1 || 0;
  const avg = (p) => { const rs = raters.filter((r) => r !== p).map((r) => rankOf(r, p)).filter(Boolean); return rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : null; };
  // Most centers first; peers break ties.
  const order = [...POWERS].sort((a, b) => count(s.owners, b) - count(s.owners, a) || (avg(a) ?? 9) - (avg(b) ?? 9));
  const grid = `<table class="grid"><tr><th></th><th>Centers</th><th>Peer rank</th>${raters.map((r) => `<th class="rater" style="color:${C(r)}">${nice(r)}</th>`).join("")}</tr>
    ${order.map((p) => `<tr style="--c:${C(p)}"><td>${nice(p)}</td><td>${count(s.owners, p)}</td><td class="avg">${avg(p)?.toFixed(1) ?? ""}</td>${raters.map((r) => `<td class="rater ${r === p ? "self" : ""}">${r === p ? "–" : rankOf(r, p) || ""}</td>`).join("")}</tr>`).join("")}</table>`;
  const sections = order.map((p) => {
    const d = R.debriefs[p], a = avg(p);
    const said = raters.filter((r) => r !== p).map((r) => ({ r, n: rankOf(r, p), x: R.ranks[r].find((x) => x.power === p) })).sort((x, y) => x.n - y.n);
    return `<section class="judged" style="--c:${C(p)}"><h3>${nice(p)}<span>${esc(G.seats[p])}, ${count(s.owners, p)} centers${a ? `, ranked ${a.toFixed(1)} by peers` : ""}</span></h3>
      ${d ? `<p class="plan">${esc(d.plan)}</p>
      <div class="line"><span class="k">Best ${phaseLink(d.best.phase)}</span><span>${esc(d.best.why)}</span></div>
      <div class="line"><span class="k">Worst ${phaseLink(d.worst.phase)}</span><span>${esc(d.worst.why)}</span></div>` : ""}
      ${said.map(({ r, n, x }) => `<div class="line"><span class="k"><span style="color:${C(r)}">${nice(r)}</span> ${ordinal(n)}</span><span>${esc(x.why)} ${phaseLink(x.phase)}</span></div>`).join("")}
    </section>`;
  }).join("");
  return `<div class="pane-head"><h2>Review</h2><span class="hint">each player on its own game, then ranking the others 1 (best) to ${POWERS.length - 1}</span></div>${grid}${sections}`;
}

function renderBand() {
  const total = G.map.centers.length;
  document.getElementById("band").innerHTML = G.phases.map((q, i) => {
    const owners = (q.after ?? q.before).owners;
    return `<button class="${i === pi ? "on" : i < pi ? "done" : ""}" data-ph="${i}" title="${q === G.final ? "Review" : season(q.phase)}">${POWERS.map((pw) => `<i style="height:${(count(owners, pw) / total) * 100}%;background:${C(pw)}"></i>`).join("")}</button>`;
  }).join("");
  // One label per year, spanning its phases.
  const years = [];
  for (const q of G.phases) { const y = q === G.final ? "review" : q.phase.slice(1); if (years.at(-1)?.y === y) years.at(-1).n++; else years.push({ y, n: 1 }); }
  document.getElementById("years").innerHTML = years.map(({ y, n }) => `<span style="grid-column:span ${n}">${y}</span>`).join("");
}

function render() {
  if (!G.phases.length) return;
  if (follow) { pi = G.phases.length - 1; si = steps(ph()).length - 1; }
  const p = ph(), k = st().k;
  document.getElementById("title").textContent = p === G.final ? "Review" : season(p.phase);
  const left = Math.max(0, Math.round((p.deadline - Date.now()) / 1000));
  // Review turns end in order: everyone's debrief, then everyone's ranking.
  const turns = Object.values(G.final?.turns ?? {});
  const reviewed = G.stage === "peers" && turns.length && turns.every((t) => t.phase === "peers");
  const reviewing = reviewed ? "" : G.stage === "debrief" ? "players are looking back" : G.stage === "peers" ? "players are ranking each other" : "";
  document.getElementById("state").textContent = { open: "opens", msg: `message ${si} of ${p.msgs.length}`, orders: p.record ? "orders in" : follow ? `${left}s left` : "in progress", resolved: "resolved", review: reviewing }[k];
  document.getElementById("play").textContent = playing ? "Pause" : "Play";
  document.getElementById("real").classList.toggle("on", real);
  document.getElementById("testing").classList.toggle("on", testing);
  document.getElementById("live").hidden = replay || follow;
  document.getElementById("pp").disabled = document.getElementById("pc").disabled = pi === 0 && si === 0;
  document.getElementById("nc").disabled = atEnd();
  document.getElementById("np").disabled = pi >= G.phases.length - 1;
  renderBand(); renderMap(); renderLedger();
  document.getElementById("outcome").innerHTML = outcome();
  // Redraws keep what the reader opened and where they scrolled; a reader at the bottom stays there.
  const right = document.getElementById("right");
  const opened = [...right.querySelectorAll("details")].flatMap((d, i) => (d.open ? [i] : []));
  const top = right.scrollTop, pinned = top + right.clientHeight >= right.scrollHeight - 20;
  right.innerHTML = testing ? renderInspector() : k === "review" ? renderReview() : renderPress();
  const details = right.querySelectorAll("details");
  for (const i of opened) if (details[i]) details[i].open = true;
  const now = right.querySelector(".msg.now");
  if (now) now.scrollIntoView({ block: "nearest" });
  // A video frame of the Testing view shows the newest trace entries.
  else right.scrollTop = (follow && pinned) || (testing && q.has("frame")) ? right.scrollHeight : top;
  document.documentElement.style.setProperty("--head", `${document.querySelector("header").offsetHeight}px`);
}

let frame = 0;
const schedule = () => { if (!frame) frame = requestAnimationFrame(() => { frame = 0; render(); }); };

function go(p, s) {
  follow = false;
  pi = Math.max(0, Math.min(p, G.phases.length - 1));
  const n = steps(ph()).length;
  si = s < 0 ? n + s : Math.min(s, n - 1);
  schedule();
}
const next = () => (si < steps(ph()).length - 1 ? go(pi, si + 1) : pi < G.phases.length - 1 ? go(pi + 1, 0) : stop());
const prev = () => (si > 0 ? go(pi, si - 1) : pi > 0 && go(pi - 1, -1));
function stop() { clearTimeout(timer); playing = false; schedule(); }

// How long a change stays up when playing: long enough to read a message.
const dwell = (p, s) => (s.k === "msg" ? Math.min(3200, 700 + p.msgs[s.i].text.length * 7) : s.k === "review" ? (G.review ? 8000 : 2500) : 1100);
// Paced: each change stays up long enough to read. Real time: the gap until the next change, as it was played.
function wait() {
  const ahead = si < steps(ph()).length - 1 ? steps(ph())[si + 1] : G.phases[pi + 1] && steps(G.phases[pi + 1])[0];
  const gap = ahead ? ahead.at - st().at : NaN;
  return real ? (Number.isFinite(gap) ? Math.max(50, gap) : 1100) : dwell(ph(), st());
}
function arm() {
  clearTimeout(timer);
  timer = setTimeout(() => { next(); if (playing) arm(); }, wait());
}
function play() {
  if (playing) return stop();
  if (follow || atEnd()) go(0, 0);
  playing = true;
  arm();
  schedule();
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-ph],[data-seat],[data-clear],[data-go]");
  if (!t) return;
  if (t.dataset.go) { stop(); go(G.phases.findIndex((q) => q.phase === t.dataset.go), -1); }
  else if (t.dataset.ph) { stop(); go(Number(t.dataset.ph), -1); }
  else if (t.dataset.seat) { if (testing) seat = t.dataset.seat; else filter = filter === t.dataset.seat ? null : t.dataset.seat; schedule(); }
  else { filter = null; schedule(); }
});
document.getElementById("pp").onclick = () => { stop(); go(si > 0 ? pi : pi - 1, 0); };
document.getElementById("np").onclick = () => { stop(); go(pi + 1, 0); };
document.getElementById("pc").onclick = () => { stop(); prev(); };
document.getElementById("nc").onclick = () => { stop(); next(); };
document.getElementById("play").onclick = play;
// A change of pace takes effect now, not after the wait already set.
document.getElementById("real").onclick = () => {
  real = !real;
  if (playing) arm();
  schedule();
};
document.getElementById("live").onclick = () => { stop(); follow = true; schedule(); };
document.getElementById("testing").onclick = () => {
  testing = !testing;
  try { localStorage.setItem("diplomabench-testing", testing ? "1" : ""); } catch {}
  schedule();
};
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); e.shiftKey ? document.getElementById("np").click() : document.getElementById("nc").click(); }
  if (e.key === "ArrowLeft") { e.preventDefault(); e.shiftKey ? document.getElementById("pp").click() : document.getElementById("pc").click(); }
  if (e.key === " ") { e.preventDefault(); play(); }
});
try { testing = localStorage.getItem("diplomabench-testing") === "1"; } catch {}
const q = new URLSearchParams(location.search);
if (q.has("testing")) testing = q.get("testing") !== "0";
if (q.has("seat")) seat = q.get("seat").toUpperCase();
// A saved file is already the export.
document.getElementById("save").hidden = document.getElementById("savesep").hidden = replay;

if (replay) {
  for (const e of window.EVENTS) ingest(e);
  // `pnpm watch --video` asks for every change and how long it stays up, then one screenshot per change.
  const frames = G.phases.flatMap((p, i) => steps(p).map((s, j) => ({ i, j, ms: dwell(p, s) })));
  const i = G.phases.findIndex((x) => x.phase === q.get("phase"));
  if (q.has("frames")) document.body.innerHTML = `<pre id="frames">${JSON.stringify(frames.map((f) => f.ms))}</pre>`;
  else if (q.has("frame")) { const f = frames[Number(q.get("frame"))]; go(f.i, f.j); }
  else if (i >= 0) go(i, q.has("step") ? Number(q.get("step")) : -1);
  // A finished game opens on its last change; Play starts from the top.
  else if (G.phases.length) go(G.phases.length - 1, -1);
  if (!q.has("frames")) render();
} else {
  const source = new EventSource("events");
  source.onmessage = (m) => { ingest(JSON.parse(m.data)); schedule(); };
  setInterval(() => follow && schedule(), 1000);
}
</script>
</body>
</html>
